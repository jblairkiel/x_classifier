{% extends "base.html" %}
{% block title %}Log in · tl-ai-detector{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Username <input name="username" autocomplete="username" required maxlength="128" autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
  <button class="primary">Log in</button>
</form>
{% endblock %}
