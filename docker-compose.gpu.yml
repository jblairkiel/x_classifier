# GPU training: docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile train run --rm train
# Needs the NVIDIA driver + NVIDIA Container Toolkit on the host.
services:
  train:
    build:
      args:
        TORCH_INDEX_URL: ${TORCH_CUDA_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    image: tl-ai-detector-train-gpu:${TL_IMAGE_TAG:-latest}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
